org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# tflite_flutter 0.12.1 的 android/build.gradle 只声明了 Java 11（sourceCompatibility /
# targetCompatibility），未声明 Kotlin 的 jvmTarget；KGP 2.4 默认按当前 JDK 编到 17，
# 于是该校验会直接让构建失败。它是本项目里唯一有此问题的模块（其余插件均为 Java 17 + JVM_17）。
# 混合 bytecode 版本在 JVM 17 上运行是安全的，故按 Kotlin 官方建议把校验降级为警告。
kotlin.jvm.target.validation.mode=warning
